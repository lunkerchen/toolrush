name: Release Pipeline

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  verify-and-release:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install pytest

    - name: Enforce Tag Matches Single Version Source of Truth
      run: |
        TAG_VERSION="${GITHUB_REF_NAME#v}"
        CODE_VERSION=$(python3 -c "import importlib.util; s=importlib.util.spec_from_file_location('v', 'v2/plugin/version.py'); m=importlib.util.module_from_spec(s); s.loader.exec_module(m); print(m.VERSION)")
        echo "Tag version: $TAG_VERSION, Code version: $CODE_VERSION"
        if [ "$TAG_VERSION" != "$CODE_VERSION" ]; then
          echo "ERROR: Release tag $GITHUB_REF_NAME does not match v2/plugin/version.py ($CODE_VERSION)"
          exit 1
        fi

    - name: Run Doctor and Test Suite
      run: |
        python v2/plugin/doctor.py
        pytest -v tests/

    - name: Package Deterministic Release Artifact
      run: |
        VERSION="${GITHUB_REF_NAME#v}"
        python3 scripts/package_release.py --version "$VERSION" --output-dir dist

    - name: Verify Artifact Checksum
      working-directory: dist
      run: sha256sum -c SHA256SUMS

    - name: Create GitHub Release
      uses: softprops/action-gh-release@v2
      with:
        files: |
          dist/toolrush-*.zip
          dist/SHA256SUMS
          dist/MANIFEST.json
        generate_release_notes: true
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
