name: Release Pipeline

on:
  push:
    tags:
      - 'v*'

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install pytest

    - name: Run Test Suite
      run: |
        python v2/plugin/doctor.py
        pytest -v tests/

    - name: Package Release Artifact
      run: |
        VERSION="${GITHUB_REF_NAME#v}"
        mkdir -p dist
        cd v2/plugin
        zip -r "../../dist/toolrush-${VERSION}.zip" . -x "*.pyc" -x "__pycache__/*"
        cd ../..
        cd dist
        sha256sum "toolrush-${VERSION}.zip" > SHA256SUMS
        echo "{\"version\": \"${VERSION}\", \"tag\": \"${GITHUB_REF_NAME}\", \"artifact\": \"toolrush-${VERSION}.zip\"}" > MANIFEST.json

    - name: Upload Artifacts
      uses: actions/upload-artifact@v4
      with:
        name: release-assets
        path: dist/*
