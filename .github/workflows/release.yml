name: Release Pipeline

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

jobs:
  version-gate:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Enforce Tag Matches Single Version Source of Truth
      run: |
        TAG_VERSION="${GITHUB_REF_NAME#v}"
        CODE_VERSION=$(python3 -c "import runpy; print(runpy.run_path('v2/plugin/version.py')['VERSION'])")
        echo "Tag version: $TAG_VERSION, Code version: $CODE_VERSION"
        if [ "$TAG_VERSION" != "$CODE_VERSION" ]; then
          echo "ERROR: Release tag $GITHUB_REF_NAME does not match v2/plugin/version.py ($CODE_VERSION)"
          exit 1
        fi

  # Full cross-OS/Python matrix from ToolRush CI; release cannot start unless every leg passes.
  test:
    needs: version-gate
    uses: ./.github/workflows/test.yml
    permissions:
      contents: read

  release:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
    - uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Package Deterministic Release Artifact
      run: |
        VERSION="${GITHUB_REF_NAME#v}"
        python3 scripts/package_release.py --version "$VERSION" --output-dir dist

    - name: Verify Artifact Checksum
      working-directory: dist
      run: sha256sum -c SHA256SUMS

    - name: Create GitHub Release
      uses: softprops/action-gh-release@v2
      with:
        files: |
          dist/toolrush-*.zip
          dist/SHA256SUMS
          dist/MANIFEST.json
        generate_release_notes: true
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
