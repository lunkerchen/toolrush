name: ToolRush CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ ubuntu-latest, macos-latest, windows-latest ]
        python-version: [ '3.11', '3.12' ]

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install pytest

    - name: Run Doctor (Basic & Smoke)
      shell: bash
      run: |
        python v2/plugin/doctor.py
        python v2/plugin/doctor.py --smoke

    - name: Run Test Suite
      shell: bash
      run: |
        pytest -v tests/

    - name: Test Local Artifact Packaging Reproducibility
      shell: bash
      run: |
        VERSION="2.1.0"
        mkdir -p dist_test
        python3 -c "
        import os, zipfile
        p = 'dist_test/toolrush-${VERSION}.zip'
        with zipfile.ZipFile(p, 'w', compression=zipfile.ZIP_DEFLATED) as zf:
            for root, dirs, files in os.walk('v2/plugin'):
                dirs.sort()
                for file in sorted(files):
                    if file.endswith('.pyc') or '__pycache__' in root:
                        continue
                    full_path = os.path.join(root, file)
                    rel_path = os.path.relpath(full_path, 'v2/plugin')
                    zf.write(full_path, rel_path)
        "
        test -f "dist_test/toolrush-${VERSION}.zip"
