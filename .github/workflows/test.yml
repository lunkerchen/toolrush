name: ToolRush CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_call:

permissions:
  contents: read

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ ubuntu-latest, macos-latest, windows-latest ]
        python-version: [ '3.11', '3.12' ]

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install pytest

    - name: Run Doctor (Basic & Smoke)
      shell: bash
      run: |
        python v2/plugin/doctor.py
        python v2/plugin/doctor.py --smoke

    - name: Run Test Suite
      shell: bash
      run: |
        pytest -v tests/

    - name: Test Local Artifact Packaging Reproducibility
      shell: bash
      run: |
        VERSION=$(python3 -c "import runpy; print(runpy.run_path('v2/plugin/version.py')['VERSION'])")
        python3 scripts/package_release.py --version "$VERSION" --output-dir dist1
        python3 scripts/package_release.py --version "$VERSION" --output-dir dist2
        A=$(python3 -c "import hashlib,sys; print(hashlib.sha256(open(sys.argv[1],'rb').read()).hexdigest())" "dist1/toolrush-${VERSION}.zip")
        B=$(python3 -c "import hashlib,sys; print(hashlib.sha256(open(sys.argv[1],'rb').read()).hexdigest())" "dist2/toolrush-${VERSION}.zip")
        echo "run1=$A"
        echo "run2=$B"
        test "$A" = "$B"
